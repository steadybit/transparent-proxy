events {}
http {
  # $server_protocol shows whether the proxy forwarded over HTTP/1.1 or HTTP/2.
  log_format lab '$remote_addr "$request" $status $server_protocol';
  access_log /dev/stdout lab;

  server {
    listen 443 ssl;
    listen 80; # plain HTTP, for cases 11-14
    http2 on;
    server_name upstream.test;
    ssl_certificate     /certs/server.crt;
    ssl_certificate_key /certs/server.key;

    location / {
      default_type text/plain;
      return 200 "hello from upstream\n";
    }
  }
}
