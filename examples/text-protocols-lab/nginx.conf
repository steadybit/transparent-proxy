events {}
http {
  log_format lab '$remote_addr "$request" $status $server_protocol';
  access_log /dev/stdout lab;

  # web.test: the attack's target, plain HTTP.
  server {
    listen 80;
    server_name web.test;
    location / {
      default_type text/plain;
      return 200 "hello from web\n";
    }
  }

  # The same site behind the PROXY protocol, as a load balancer's backend
  # (curl --haproxy-protocol): over plain HTTP on 8080 and over TLS on 8443.
  server {
    listen 8080 proxy_protocol;
    listen 8443 ssl proxy_protocol;
    server_name web.test;
    ssl_certificate     /certs/server.crt;
    ssl_certificate_key /certs/server.key;
    location / {
      default_type text/plain;
      return 200 "hello from web behind the PROXY protocol\n";
    }
  }
}
