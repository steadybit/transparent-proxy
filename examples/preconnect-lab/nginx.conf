events {}
http {
  # $server_protocol shows whether a request reached nginx over HTTP/1.1 or HTTP/2.
  log_format lab '$remote_addr "$request" $status $server_protocol';
  access_log /dev/stdout lab;
  # nginx's own limit for a silent client is client_header_timeout (60s), well
  # above the lab's idle times, so without the proxy an idle connection survives.

  server {
    listen 443 ssl;
    http2 on;
    server_name upstream.test;
    ssl_certificate     /certs/server.crt;
    ssl_certificate_key /certs/server.key;

    location / {
      default_type text/plain;
      return 200 "hello from upstream\n";
    }
  }
}
