name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  build-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.25"
          check-latest: true
      - name: Vet
        run: go vet ./...
      - name: Test
        run: go test -race ./...
      - name: Build (linux amd64 + arm64)
        run: make linux

  integration-linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.25"
          check-latest: true
      # Exercises SO_ORIGINAL_DST recovery, the full REDIRECT capture path (with
      # SO_MARK loop protection), and live mesh preflight detection against real
      # iptables (needs root).
      - name: Interception, preflight, fail-open & end-to-end under real iptables
        run: sudo env "PATH=$PATH" "HOME=$HOME" go test -tags integration -run 'TestOriginalDst|TestRedirect|TestDetect_Live|TestGuard_RealTeardown|TestE2E' ./internal/proxy/ ./internal/preflight/ ./internal/supervisor/ -v
